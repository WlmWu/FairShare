<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Enjoy meals with friends but tired of calculating and splitting the bill? Try Shareceipt! A simple, intuitive tool requires no registration and handles tax, service charges, and other additional fees effortlessly." />
    <title>Shareceipt: Quick and Easy Expense Sharing</title>

    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=receipt_long" />

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Responsive App Container -->
    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon"><i class="fa-solid fa-receipt"></i></span>
                <div class="logo-text-group">
                    <h1 class="logo-title">Shareceipt</h1>
                    <span class="logo-subtitle">Quick and Easy Expense Sharing</span>
                </div>
            </div>
            <button class="info-btn-circle" id="app-info-btn" title="App Info" aria-controls="app-modal" aria-expanded="false">
                <i class="fa-solid fa-circle-info"></i>
            </button>
        </header>

        <!-- Card 1: Scan / New Split Bill -->
        <section class="app-card">
            <div class="card-header-bar">
                Receipt
                <button id="update-api-key-btn" class="key-chip" type="button" title="Gemini settings" aria-label="Gemini settings" aria-controls="key-modal">
                    <i class="fa-solid fa-key" aria-hidden="true"></i>
                    <span id="key-chip-model" class="key-chip-value">Flash</span>
                    <i id="key-chip-check" class="fa-solid fa-check key-check-icon" aria-hidden="true" hidden></i>
                </button>
            </div>
            <div class="card-body text-center">
                <div class="new-split-bill-hero">
                    <div class="hero-camera-circle" id="receipt-preview-frame">
                        <span class="material-symbols-outlined hero-receipt-symbol">receipt_long</span>
                        <i class="fa-solid fa-spinner fa-spin hero-scan-spinner"></i>
                        <img id="receipt-preview-img" alt="Receipt preview">
                    </div>
                    <h3 class="hero-title">New Split Bill</h3>
                    <p class="hero-subtitle">Upload a receipt or create a manual entry</p>
                </div>

                <div class="action-buttons-row">
                    <button class="btn-primary" id="receipt-upload-btn" role="button">
                        <span class="btn-content">
                            <i class="fa-solid fa-camera"></i>
                            &nbsp;Upload
                        </span>
                    </button>
                    <input type="file" id="receipt-upload-input" style="display: none;" accept="image/*">

                    <button class="btn-outline" id="manual-entry-btn">
                        <span class="btn-outline-icon"><i class="fa-solid fa-plus"></i></span>
                        &nbsp;Manual
                    </button>
                </div>
            </div>
        </section>

        <!-- Card 2: Friends / Add Contact -->
        <section class="app-card" id="friends-section">
            <div class="card-header-bar">Friends</div>
            <div class="card-body">
                <div class="friends-scroll-wrapper">
                    <div id="friends-list">
                        <!-- Populated dynamically by JS -->
                    </div>
                    <button id="add-friend" class="avatar-add-btn">
                        <div class="avatar-circle-add">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        <span class="add-label">Add</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Card 3: Shares / Item List -->
        <section class="app-card" id="bill-section">
            <div class="card-header-bar">Shares</div>
            <div class="card-body">
                <div id="items-list">
                    <!-- Populated dynamically by JS -->
                </div>

                <button id="add-item" class="btn-add-item">
                    <span class="plus-circle-green"><i class="fa-solid fa-plus"></i></span>
                    &nbsp;Add
                </button>

                <!-- Summary block inside the card -->
                <div class="item total-amount-container mt-4">
                    <div class="summary-toggle-header">
                        <button class="collapse-btn" data-bs-toggle="collapse" data-bs-target="#detail-amount-container" aria-expanded="true" aria-controls="detail-amount-container">
                            <i class="fa-solid fa-angle-right" style="font-size: 14px; display: none;"></i>
                            <i class="fa-solid fa-angle-down" style="font-size: 14px;"></i>
                        </button>
                        <div id="total-amount-title" class="summary-amount-title">
                            Total Amount&emsp;<span id="total-amount">$0.00</span>
                        </div>
                    </div>

                    <div class="collapse show" id="detail-amount-container">
                        <div class="detail-amount-content">
                            <div class="summary-detail-row">
                                <span class="detail-label">Subtotal Amount</span>
                                <span class="detail-value"><span id="subtotal-amount">$0.00</span></span>
                            </div>
                            <div class="summary-detail-row align-items-center">
                                <label for="total-amount-additional" class="detail-label m-0">Additional Fee</label>
                                <div class="fee-input-wrapper">
                                    <input type="number" id="total-amount-additional" min="0" step="0.1" placeholder="0.0">
                                    <span class="fee-percentage-sign">%</span>
                                </div>
                            </div>
                            <div class="summary-detail-row align-items-center border-top pt-3 mt-2">
                                <span class="detail-label font-bold total-amount-detail-label">
                                    Total Amount
                                    <span class="mytooltip" id="total-amount-tooltip">
                                        <i class="fa-regular fa-circle-question"></i>
                                        <span class="tooltiptext">
                                            Total = Subtotal × (1 + Fee)
                                        </span>
                                    </span>
                                </span>
                                <div class="total-input-wrapper">
                                    <span class="currency-prefix">$</span>
                                    <input type="number" id="total-amount-input" min="0" step="1" placeholder="0.00">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Card 4: Split / Results -->
        <section class="app-card" id="results">
            <div class="card-header-bar">Split</div>
            <div class="card-body">
                <span id="results-alert" class="alert-text"></span>
                <div id="results-output" class="results-list">
                    <!-- Populated dynamically by JS -->
                </div>
                <div id="settlement-section" class="collapse">
                    <div class="section-divider"></div>
                    <span id="settlement-alert" class="alert-text"></span>
                    <div id="settlement-paid-inputs"></div>
                    <div class="pt-1 pb-3" id="settlement-output"></div>
                </div>

                <div class="result-actions">
                    <button id="settlement-toggle-btn" class="btn-share-action" ontouchstart="" data-bs-toggle="collapse" data-bs-target="#settlement-section">
                        <i class="fa-solid fa-money-bill-transfer"></i>
                        &nbsp;Settle
                    </button>
                    <button id="share-result-btn" class="btn-share-action">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                        &nbsp;Share
                    </button>
                </div>
            </div>
        </section>
    </div>

    <div class="app-modal" id="app-modal" role="dialog" aria-modal="true" aria-labelledby="app-modal-title" hidden>
        <div class="app-modal-panel">
            <button class="modal-close-button" id="app-modal-close" type="button" aria-label="Close window">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="app-modal-body" id="app-modal-body"></div>
        </div>
    </div>

    <div class="app-modal" id="key-modal" role="dialog" aria-modal="true" aria-labelledby="key-modal-title" hidden>
        <div class="app-modal-panel">
            <button class="modal-close-button" id="key-modal-close" type="button" aria-label="Close Gemini settings">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="app-modal-body">
                <h2 id="key-modal-title">Gemini</h2>
                <label class="key-modal-label" for="key-modal-input">API key</label>
                <div class="key-input-row">
                    <input id="key-modal-input" class="modal-editor-input" type="password" autocomplete="off" placeholder="Paste your API key">
                    <button id="key-modal-clear" class="key-clear-button" type="button" aria-label="Clear API key">
                        <i class="fa-solid fa-trash" aria-hidden="true"></i>
                    </button>
                </div>
                <fieldset class="model-choice-field" id="model-choice-field">
                    <legend>Model</legend>
                    <div class="model-choice-control">
                        <div class="model-switch">
                            <label>
                                <input type="radio" name="geminiModel" value="flash">
                                <span>Flash</span>
                            </label>
                            <label>
                                <input type="radio" name="geminiModel" value="lite">
                                <span>Lite</span>
                            </label>
                        </div>
                        <span id="model-choice-hint" class="model-choice-hint">More detailed</span>
                    </div>
                </fieldset>
            </div>
        </div>
    </div>

    <!-- Hidden JQuery load -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
